launcher_args: {experiment_name: joint_train_msg,
  script_name: "src/ms_pred/iceberg_transformer/train_contr_joint.py",
  slurm_script: launcher_scripts/generic_slurm.sh,
  launch_method: local,
  visible_devices: [1, 2]
}
universal_args:
  _slurm_args:
  - {_num_gpu: 1, cpus-per-task: 7, job-name: joint_train, mem-per-cpu: 8G,
    time: '1-12:00:00'}
  debug: [true]
  gpu: [true]

  seed: [1]
  num-workers: [64]
  batch-size: [16]
  max-epochs: [20]
  min-epochs: [0]

  dataset-name: [msg]
  dataset-labels: [labels_withev.tsv]
  magma-folder: [magma_outputs]
  split-name: [split.tsv]

  learning-rate: [0.0001]
  lr-decay-rate: [0.95]
  num-decoys: [3]
  all-decoy-nums: [10]
  weight-decay: [0.0]
  grad-accumulate: [2]

  inten-dropout: [0.05]
  frag-dropout: [0]
  hidden-size: [512]
  graphormer-layers: [4]
  graphormer-dropout: [0]
  embed-elem-group: [True]
  add-hs: [True]
  embed-adduct: [True]
  embed-collision: [True]
  embed-instrument: [True]
  encode-forms: [True]
  inten-decoder-layers: [3]
  inten-encoder-layers: [3]
  frag-encoder-layers: [0]
  frag-decoder-layers: [4]
  max-broken-bonds: [6]
  max-breakpoints: [100]
  multi-hop-max-dist: [10]
  num-edge-dis: [10]
  enable-aux-loss: [True]
  enable-decoder-norm: [False]
  sk-tau: [0.05]
  linsat-tau: [15]
  inten-weight: [1]
  frag-weight: [0.1]
  magma-warmup-steps: [2500]
  magma-decay-rate: [0.9]
  magma-decay-steps: [2500]
  warmup: [1000]
  binned-targs: [True]
  inten-loss-fn: [cosine]
  contr-loss-fn: [entropy]
  contr-weight: [1]
  train-checkpoint: [results/joint_train_msg/split_rnd1/version_0/best.ckpt]
  pubchem-map-path: ['data/retrieval/pubchem/pubchem_formulae_inchikey.hdf5']


iterative_args:
  -  split-name: [split.tsv]
     save-dir: [split_rnd1]
     seed: [1]
