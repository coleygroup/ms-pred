launcher_args: {experiment_name: frag_only_nist20,
  script_name: "src/ms_pred/iceberg_transformer/train_frag.py",
  slurm_script: launcher_scripts/generic_slurm.sh,
  launch_method: local,
  visible_devices: [3]
}
universal_args:
  _slurm_args:
  - {_num_gpu: 1, cpus-per-task: 7, job-name: frag_only_train, mem-per-cpu: 8G,
    time: '1-12:00:00'}
  debug: [false]
  gpu: [true]

  seed: [1]
  num-workers: [32]
  batch-size: [32]
  max-epochs: [150]

  dataset-name: [nist20]
  split-name: [split_1.tsv]

  learning-rate: [0.0002]
  lr-decay-rate: [0.825]
  weight-decay: [0.0]

  dropout: [0]
  hidden-size: [256]
  layers: [3]
  max-frags: [60]
  pe-embed-k: [14]

  root-encode: [graphormer]
  embed-elem-group: [True]
  embed-adduct: [True]
  embed-collision: [True]
  add-hs: [true]
  sk-tau: [0.05]
  linsat-tau: [20]
  multi-hop-max-dist: [5]
  num-edge-dis: [10]

iterative_args:
  -  split-name: [split_1.tsv]
     save-dir: [split_1_rnd1]
     seed: [1]
