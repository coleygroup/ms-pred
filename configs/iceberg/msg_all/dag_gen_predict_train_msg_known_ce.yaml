launcher_args: {experiment_name: iceberg_msg_known_ce,
  script_name: "src/ms_pred/iceberg/predict_gen.py",
  slurm_script: launcher_scripts/generic_slurm.sh,
  launch_method: local,
  visible_devices: [0, 1]
}
universal_args:
  _slurm_args:
  - {nodes: 1, ntasks: 1, gpus: l40s:2, cpus-per-task: 16, job-name: forward_train, mem: 160G,
    time: '1-18:00:00'}
  debug: [false]
  gpu: [true]
  dataset-name: [msg_known_ce]
  batch-size: [96]
  num-gpu-workers: [4]
  num-cpu-workers: [32]
  threshold: [0.0]
  max-nodes: [100]
  num-decoys: [0] # predict target structures for intensity-model training, no decoys

iterative_args:
  -  split-name: [split.tsv]
     checkpoint-pth: [results/iceberg_msg_known_ce/split_rnd1/ckpt/gen/best.ckpt]
     save-dir: [split_rnd1/preds_train_100]
