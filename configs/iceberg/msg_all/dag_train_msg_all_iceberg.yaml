launcher_args: {experiment_name: iceberg_msg_all_iceberg,
  script_name: "src/ms_pred/iceberg/train_gen.py",
  slurm_script: launcher_scripts/generic_slurm.sh,
  launch_method: local,
  visible_devices: [0]
}
universal_args:
  _slurm_args:
  - {nodes: 1, ntasks: 1, gpus: l40s:1, cpus-per-task: 16, job-name: forward_train, mem: 160G,
    time: '1-18:00:00'}
  debug: [false]
  gpu: [true]

  seed: [1]
  num-workers: [16]
  batch-size: [32]
  max-epochs: [200]
  dataset-name: [msg_all_iceberg]
  split-name: [split.tsv]
  dataset-labels: [labels.tsv]
  magma-folder: [magma_outputs]
  learning-rate: [0.000996]
  lr-decay-rate: [0.7214]

  dropout: [0.2]
  mpnn-type: [GGNN]
  pe-embed-k: [14]
  pool-op: [avg]
  set-layers: [0]
  hidden-size: [512]
  weight-decay: [0.0]
  layers: [6]

  root-encode: [gnn]
  inject-early: [False]
  encode-forms: [True]
  embed-adduct: [True]
  embed-collision: [True]
  embed-elem-group: [True]
  embed-instrument: [True]
  add-hs: [true]

iterative_args:
  -  split-name: [split.tsv]
     save-dir: [split_rnd1]
     seed: [1]
