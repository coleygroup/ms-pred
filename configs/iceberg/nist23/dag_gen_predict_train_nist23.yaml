launcher_args: {experiment_name: iceberg_nist23,
  script_name: "src/ms_pred/iceberg/predict_gen.py",
  slurm_script: launcher_scripts/generic_slurm.sh,
  launch_method: local,
  visible_devices: [0, 1],
}
universal_args:
  _slurm_args:
  - {gpus: 1, cpus-per-task: 7, job-name: forward_train, mem-per-cpu: 8G,
    time: '1-18:00:00'}
  debug: [false]
  gpu: [true]

  batch-size: [96]
  dataset-name: [nist23]
  num-gpu-workers: [4]
  num-cpu-workers: [32]
  threshold: [0.0]
  max-nodes: [100]
  num-decoys: [0, 10] # predict target structures + 10 decoys
  # to predict decoys, you have to download https://zenodo.org/records/15529765/files/pubchem_formulae_inchikey.hdf5
  # and place it at the following path (pubchem-map-path)
  pubchem-map-path: ['data/retrieval/pubchem/pubchem_formulae_inchikey.hdf5']

iterative_args:
  -  split-name: [split_1.tsv]
     checkpoint-pth: [results/iceberg_nist23/split_1_rnd1/ckpt/gen/best.ckpt]
     save-dir: [split_1_rnd1/preds_train_100]

