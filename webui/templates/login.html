<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Internal Login — ICEBERG</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f7;
            color: #111827;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #111827;
            color: #f9fafb;
            padding: 0.75rem 2rem;
        }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-title {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 600;
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .login-card {
            background: #ffffff;
            border-radius: 0.75rem;
            padding: 2rem 2.5rem;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.09);
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            margin: 0 0 0.25rem;
            font-size: 1.2rem;
        }
        .login-card p.subtitle {
            margin: 0 0 1.5rem;
            color: #6b7280;
            font-size: 0.875rem;
        }
        .field { margin-bottom: 1rem; }
        .field label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.3rem;
            color: #374151;
        }
        .field input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.4rem;
            font-size: 0.95rem;
            color: #111827;
            background: #f9fafb;
            outline: none;
            transition: border-color 0.15s;
        }
        .field input:focus {
            border-color: #2563eb;
            background: #fff;
        }
        .btn-login {
            width: 100%;
            padding: 0.6rem 1rem;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 0.45rem;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.15s;
        }
        .btn-login:hover { background: #1d4ed8; }
        .error-msg {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #b91c1c;
            border-radius: 0.4rem;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.85rem;
            color: #6b7280;
            text-decoration: none;
        }
        .back-link:hover { color: #111827; text-decoration: underline; }
    </style>
</head>
<body>
<header>
    <div class="header-inner">
        <h1 class="header-title">ICEBERG Spectrum Retrieval</h1>
    </div>
</header>
<main>
    <div class="login-card">
        <h2>Internal Access</h2>
        <p class="subtitle">Sign in to include NIST'23 structures in atlas queries.</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('login', next=request.args.get('next', '')) }}">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email"
                       placeholder="you@example.com" required autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Sign in</button>
        </form>

        <a href="{{ url_for('index') }}" class="back-link">Back to public atlas</a>
    </div>
</main>
</body>
</html>
